# Стенд варианта 29: dep-a (модуль планирования) и core (диспетчерская).
# Код берётся из configmap "code": kubectl create configmap code --from-file=dep.py --from-file=core.py --from-file=loadgen.py
apiVersion: apps/v1
kind: Deployment
metadata: {name: dep-a}
spec:
  replicas: 1
  selector: {matchLabels: {app: dep-a}}
  template:
    metadata: {labels: {app: dep-a}}
    spec:
      containers:
      - name: dep-a
        image: python:3.12-slim
        command: ["python", "-u", "/code/dep.py"]
        env: [{name: PORT, value: "8081"}]
        ports: [{containerPort: 8081}]
        readinessProbe: {httpGet: {path: /healthz, port: 8081}, periodSeconds: 2}
        volumeMounts: [{name: code, mountPath: /code}]
      volumes: [{name: code, configMap: {name: code}}]
---
apiVersion: v1
kind: Service
metadata: {name: dep-a}
spec:
  selector: {app: dep-a}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: core}
spec:
  replicas: 1
  selector: {matchLabels: {app: core}}
  template:
    metadata: {labels: {app: core}}
    spec:
      containers:
      - name: core
        image: python:3.12-slim
        command: ["python", "-u", "/code/core.py"]
        env:
        - {name: PORT, value: "8080"}
        - {name: DEP_URL, value: "http://dep-a:8081"}
        - {name: PATTERN, value: "off"}
        - {name: BULKHEAD_SIZE, value: "4"}     # R=4
        - {name: TIMEOUT_S, value: "1.0"}
        - {name: STOP_TIMEOUT_S, value: "0.3"}
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}   # dep-a не проверяет
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
        volumeMounts: [{name: code, mountPath: /code}]
      volumes: [{name: code, configMap: {name: code}}]
---
apiVersion: v1
kind: Service
metadata: {name: core}
spec:
  selector: {app: core}
  ports: [{port: 8080, targetPort: 8080}]
